<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photo album by Justin Lu.">
  <title>Photo Album | Justin Lu Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Alata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightbox3/dist/lightbox3.css">
  <script src="https://cdn.jsdelivr.net/npm/lightbox3/dist/lightbox3.min.js"></script>
</head>
<body>
  <div id="nav"></div>
  <script>
    fetch('/nav.html')
      .then(response => {
        if (!response.ok) throw new Error(`Navigation request failed: ${response.status}`);
        return response.text();
      })
      .then(html => {
        document.getElementById('nav').innerHTML = html;
      })
      .catch(error => console.error('Unable to load navigation:', error));
  </script>

  <main>
    <a class="album-back-link" href="/index.html#albums">← All albums</a>
    <section class="album-cover" aria-label="Album cover">
      <img id="album-cover-image" alt="" fetchpriority="high">
      <div class="album-cover-copy">
        <p class="eyebrow">Justin Lu Photography</p>
        <h1 id="album-title">Photo album</h1>
      </div>
    </section>
    <p id="album-description" class="album-description" hidden></p>
    <section class="gallery-section album-page-section">
      <div class="gallery-heading">
        <p class="eyebrow">A collection of moments</p>
        <h2>Photographs</h2>
      </div>
      <div class="portfolio-items-wrapper" id="album-photos" aria-label="Album photographs"></div>
      <p id="album-loading" class="loading-status" role="status">Loading photographs…</p>
    </section>
  </main>

  <script type="module">
    const album = new URLSearchParams(window.location.search).get('album');
    const title = document.getElementById('album-title');
    const status = document.getElementById('album-loading');
    const gallery = document.getElementById('album-photos');
    const cover = document.getElementById('album-cover-image');
    const description = document.getElementById('album-description');

    if (!album || !/^[a-zA-Z0-9_-]+$/.test(album)) {
      status.textContent = 'This album could not be found.';
    } else {
      try {
        const response = await fetch(`/api/photographyWebsite?album=${encodeURIComponent(album)}`);
        if (!response.ok) throw new Error(`Photograph request failed: ${response.status}`);
        const albumData = await response.json();
        title.textContent = albumData.title;
        document.title = `${title.textContent} | Justin Lu Photography`;

        if (albumData.coverUrl) {
          cover.src = albumData.coverUrl;
          cover.alt = `${title.textContent} album cover`;
        } else {
          cover.closest('.album-cover').hidden = true;
        }

        if (albumData.description) {
          description.textContent = albumData.description;
          description.hidden = false;
        }

        albumData.photos.forEach((photo, index) => {
          const item = document.createElement('figure');
          item.className = 'portfolio-item-wrapper';

          const link = document.createElement('a');
          link.className = 'lightbox-link';
          link.href = photo.url;
          link.setAttribute('data-lightbox', 'album');
          link.setAttribute('aria-label', `Open photograph ${index + 1}`);

          const image = document.createElement('img');
          image.className = 'portfolio-img-background';
          image.src = photo.url;
          image.alt = `${title.textContent}, photograph ${index + 1}`;
          image.loading = 'lazy';

          link.appendChild(image);
          item.appendChild(link);
          gallery.appendChild(item);
        });

        status.textContent = albumData.photos.length ? '' : 'No photographs found in this album.';
        if (typeof Lightbox3 !== 'undefined') Lightbox3.Lightbox.init();
      } catch (error) {
        console.error('Unable to load album photographs:', error);
        status.textContent = 'Photographs could not be loaded.';
      }
    }
  </script>
  <section class="instagram-section" aria-labelledby="instagram-heading">
    <div class="instagram-heading">
      <div>
        <p class="eyebrow">On Instagram</p>
        <h2 id="instagram-heading">More moments</h2>
      </div>
      <a href="https://www.instagram.com/justinluigi_/" target="_blank" rel="noopener noreferrer">Follow @justinluigi_</a>
    </div>
    <div class="instagram-feed-shell">
      <div class="sk-instagram-feed" data-embed-id="25723425"></div>
    </div>
  </section>
  <script src="https://widgets.sociablekit.com/instagram-feed/widget.js" defer></script>
  <footer class="site-footer">
    <p>Justin Lu Photography</p>
    <nav aria-label="Footer navigation">
      <a href="/index.html#albums">Gallery</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected photographs by Justin Lu.">
  <title>Justin Lu Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Alata&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightbox3/dist/lightbox3.css">
  <script src="https://cdn.jsdelivr.net/npm/lightbox3/dist/lightbox3.min.js"></script>
  <script>
    (function () {
      const config = {
        url: 'https://faro-collector-prod-au-southeast-1.grafana.net/collect/9cd5ffc4de42c609de61456aff1fcd49',
        app: {
          name: 'justinluphotography-prod',
          version: '1.0.0',
          environment: 'production'
        }
      };
      const webSdkScript = document.createElement('script');
      webSdkScript.src = 'https://unpkg.com/@grafana/faro-web-sdk@2/dist/bundle/faro-web-sdk.iife.js';
      webSdkScript.onload = () => {
        window.GrafanaFaroWebSdk.initializeFaro(config);
        const webTracingScript = document.createElement('script');
        webTracingScript.src = 'https://unpkg.com/@grafana/faro-web-tracing@2/dist/bundle/faro-web-tracing.iife.js';
        webTracingScript.onload = () => {
          window.GrafanaFaroWebSdk.faro.instrumentations.add(
            new window.GrafanaFaroWebTracing.TracingInstrumentation()
          );
        };
        document.head.appendChild(webTracingScript);
      };
      document.head.appendChild(webSdkScript);
    })();
  </script>
</head>
<body class="home-page">
  <div id="nav"></div>
  <script>
    fetch('/nav.html')
      .then(response => {
        if (!response.ok) throw new Error(`Navigation request failed: ${response.status}`);
        return response.text();
      })
      .then(html => {
        document.getElementById('nav').innerHTML = html;
      })
      .catch(error => console.error('Unable to load navigation:', error));
  </script>

  <main>
    <section class="hero" aria-label="Justin Lu Photography">
      <div class="hero-copy">
        <p class="hero-kicker">Photography by Justin Lu</p>
        <h1>Moments<br>in passing.</h1>
      </div>
      <a class="scroll-cue" href="#albums" aria-label="Scroll to photo albums">
        <span>Discover</span>
        <span class="scroll-arrow" aria-hidden="true">↓</span>
      </a>
    </section>

    <section class="album-section" id="albums">
      <div class="gallery-heading">
        <p class="eyebrow">Stories from the road</p>
        <h2>Photo albums</h2>
      </div>
      <div class="album-items-wrapper" id="album-items-wrapper" aria-label="Photo albums"></div>
      <p id="album-status" class="loading-status" role="status">Loading albums…</p>
    </section>

    <section class="gallery-section" id="gallery">
      <div class="gallery-heading">
        <p class="eyebrow">A collection of moments</p>
        <h2>Selected photographs</h2>
      </div>
      <div class="portfolio-items-wrapper" id="portfolio-items-wrapper" aria-label="Photograph gallery"></div>
      <p id="loading" class="loading-status" role="status" style="display: none;">Loading photographs…</p>
    </section>
  </main>

  <script type="module" src="/js/albums.js"></script>
  <script type="module">
    const photosPerLoad = 9;
    let curIndex = 0;
    let loading = false;
    let allPhotos = [];
    let loadFailed = false;

    async function loadMorePhotos() {
      if (loading || (curIndex >= allPhotos.length && allPhotos.length > 0)) return;
      loading = true;
      const status = document.getElementById('loading');
      status.textContent = 'Loading photographs…';
      status.style.display = 'block';
      loadFailed = false;

      try {
        if (allPhotos.length === 0) {
          const response = await fetch('/api/photographyWebsite');
          if (!response.ok) throw new Error(`Photograph request failed: ${response.status}`);
          const data = await response.json();
          allPhotos = Array.from(data.values());
        }

        const gallery = document.getElementById('portfolio-items-wrapper');
        const end = Math.min(curIndex + photosPerLoad, allPhotos.length);

        for (let i = curIndex; i < end; i++) {
          const item = document.createElement('figure');
          item.className = 'portfolio-item-wrapper';
          const lightboxLink = document.createElement('a');
          lightboxLink.className = 'lightbox-link';
          lightboxLink.href = allPhotos[i].url;
          lightboxLink.setAttribute('data-lightbox', 'gallery');
          lightboxLink.setAttribute('aria-label', `Open photograph ${i + 1}`);

          const image = document.createElement('img');
          image.className = 'portfolio-img-background';
          image.src = allPhotos[i].url;
          image.alt = `Photograph ${i + 1}`;
          image.loading = 'lazy';
          lightboxLink.appendChild(image);
          item.appendChild(lightboxLink);
          gallery.appendChild(item);
        }

        curIndex = end;
        if (typeof Lightbox3 !== 'undefined') Lightbox3.Lightbox.init();
      } catch (error) {
        console.error('Unable to load photographs:', error);
        status.textContent = 'Photographs could not be loaded. Scroll to try again.';
        loadFailed = true;
      } finally {
        if (!loadFailed && curIndex >= allPhotos.length) {
          window.removeEventListener('scroll', handleScroll);
        }
        status.style.display = loadFailed ? 'block' : 'none';
        loading = false;
      }
    }

    function handleScroll() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMorePhotos();
    }

    loadMorePhotos();
    window.addEventListener('scroll', handleScroll);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photo albums by Justin Lu.">
  <meta name="author" content="Justin Lu">
  <title>Justin Lu Photography</title>
  <link href="https://use.typekit.net/mai4fgw.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/codrops-content-layout-transition.css">
  <link rel="stylesheet" href="/css/home-layout.css">
  <script type="importmap">
    {
      "imports": {
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.10.4/index.js",
        "gsap/Flip": "https://cdn.jsdelivr.net/npm/gsap@3.10.4/Flip.js",
        "gsap/Observer": "https://cdn.jsdelivr.net/npm/gsap@3.10.4/Observer.js"
      }
    }
  </script>
  <script>
    document.documentElement.className = "js";
  </script>
  <script>
    (function () {
      const config = {
        url: 'https://faro-collector-prod-au-southeast-1.grafana.net/collect/9cd5ffc4de42c609de61456aff1fcd49',
        app: {
          name: 'justinluphotography-prod',
          version: '1.0.0',
          environment: 'production'
        }
      };
      const webSdkScript = document.createElement('script');
      webSdkScript.src = 'https://unpkg.com/@grafana/faro-web-sdk@2/dist/bundle/faro-web-sdk.iife.js';
      webSdkScript.onload = () => {
        window.GrafanaFaroWebSdk.initializeFaro(config);
        const webTracingScript = document.createElement('script');
        webTracingScript.src = 'https://unpkg.com/@grafana/faro-web-tracing@2/dist/bundle/faro-web-tracing.iife.js';
        webTracingScript.onload = () => {
          window.GrafanaFaroWebSdk.faro.instrumentations.add(
            new window.GrafanaFaroWebTracing.TracingInstrumentation()
          );
        };
        document.head.appendChild(webTracingScript);
      };
      document.head.appendChild(webSdkScript);
    })();
  </script>
</head>
<body class="demo-1 home-page loading">
  <main>
    <div class="frame">
      <a class="frame__logo" href="#albums" aria-label="Justin Lu Photography, back to album collection">
        <h2 class="frame__logo-title">Justin Lu</h2>
        <span class="frame__logo-subtitle">Photography</span>
      </a>
      <nav class="frame__title" aria-label="Main navigation">
        <a href="/travel.html">Travel</a>
        <a href="/event.html">Events</a>
        <a href="/portrait.html">Portraits</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/contact.html">Contact</a>
        <a href="/about.html">About</a>
        <a href="https://www.instagram.com/justinluigi_/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>

    <div class="content" aria-label="Album details">
      <div id="album-content"></div>
      <button class="content__back unbutton" type="button" aria-label="Back to album stack">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.4939 20.5644C11.1821 20.8372 10.7083 20.8056 10.4356 20.4939L3.43557 12.4939C3.18814 12.2111 3.18814 11.7889 3.43557 11.5061L10.4356 3.50613C10.7083 3.1944 11.1822 3.16281 11.4939 3.43557C11.8056 3.70834 11.8372 4.18216 11.5644 4.49388L5.65283 11.25L20 11.25C20.4142 11.25 20.75 11.5858 20.75 12C20.75 12.4142 20.4142 12.75 20 12.75L5.65283 12.75L11.5644 19.5061C11.8372 19.8179 11.8056 20.2917 11.4939 20.5644Z"/>
        </svg>
        <span class="oh__inner">Back</span>
      </button>
      <nav class="content__nav-wrap" aria-label="Album slideshow navigation">
        <button class="content__nav content__nav--prev unbutton" type="button" aria-label="Previous album">
          <svg aria-hidden="true" width="100" height="267" viewBox="0 0 100 267"><path d="M49.894 2.766v262.979" stroke-linecap="square"/><path fill="none" d="M99.75 76.596C73.902 76.596 52.62 43.07 49.895 0 47.168 43.07 25.886 76.596.036 76.596"/></svg>
        </button>
        <button class="content__nav content__nav--next unbutton" type="button" aria-label="Next album">
          <svg aria-hidden="true" width="100" height="267" viewBox="0 0 100 267"><path d="M49.894 2.766v262.979" stroke-linecap="square"/><path fill="none" d="M99.75 76.596C73.902 76.596 52.62 43.07 49.895 0 47.168 43.07 25.886 76.596.036 76.596"/></svg>
        </button>
      </nav>
    </div>

    <div class="slides"></div>
    <div class="stack-wrap" id="albums">
      <div class="stack" id="album-stack" aria-label="Photo albums">
        <div class="stack__item stack__item--empty" aria-hidden="true"></div>
        <div class="stack__item stack__item--empty" aria-hidden="true"></div>
      </div>
      <p class="album-load-status" id="album-status" role="status" aria-live="polite"></p>
    </div>
    <div class="title">
      <h1 class="title__main oh"><span class="oh__inner">Photography</span></h1>
      <span class="title__sub oh"><span class="oh__inner">Travel · Events · Portraits</span></span>
    </div>
  </main>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
